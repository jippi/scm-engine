name: Documentation

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: arduino/setup-task@v2
        with:
          # renovate: datasource=github-releases depName=go-task/task
          version: 3.43.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: setup
        run: task setup

      - name: generate
        run: task docs:generate

      # 'task docs:deploy' runs 'mkdocs gh-deploy' inside a container that only
      # has the repository bind-mounted, so it can't see the credentials
      # actions/checkout keeps outside the work tree (in $RUNNER_TEMP, wired up
      # via 'includeIf.gitdir' since checkout v6). Put the token on the remote
      # URL instead - that lives in .git/config, which is mounted.
      - name: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          task docs:deploy
