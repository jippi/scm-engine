version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gomodguard_v2
    - gosec
    - govet
    - inamedparam
    - ineffassign
    - mirror
    - misspell
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - staticcheck
    - tagalign
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wsl_v5
  settings:
    # golangci-lint v2 merged the "gosimple" (S*), "stylecheck" (ST*) and
    # "quickfix" (QF*) linters into "staticcheck". Only the SA* checks were
    # enabled before the v2 migration, so keep the scope unchanged.
    staticcheck:
      checks:
        - SA*
    depguard:
      rules:
        DontUse:
          deny:
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    nestif:
      min-complexity: 6
    tagalign:
      align: true
      sort: true
      order:
        - expr
        - graphql
        - default
        - koanf
        - wire
        - json
        - yaml
        - mapstructure
        - validate
      strict: true
    unparam:
      check-exported: true
    varnamelen:
      check-return: true
      check-type-param: true
      ignore-names:
        - err
        - i
        - id
        - mr
        - ok
        - r
        - tt
        - w
        - wg
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
